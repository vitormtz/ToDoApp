<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lista de Tarefas</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
  </head>
  <body class="bg-gray-100 min-h-screen py-8">
    <div class="container mx-auto px-4 max-w-2xl">
      <!-- Cabeçalho -->
      <header class="text-center mb-8">
        <h1 class="text-3xl font-bold text-gray-800 mb-2">Lista de Tarefas</h1>
        <p class="text-gray-600">Organize suas atividades diárias</p>
      </header>

      <!-- Formulário de adição de tarefas -->
      <div class="bg-white rounded-lg shadow-md p-6 mb-6">
        <div class="flex gap-2">
          <input
            type="text"
            id="novaTarefa"
            placeholder="Digite uma nova tarefa..."
            class="flex-1 px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
          <button
            id="btnAdicionar"
            class="bg-blue-500 text-white px-6 py-2 rounded-lg hover:bg-blue-600 transition-colors"
          >
            Adicionar
          </button>
        </div>
      </div>

      <!-- Lista de tarefas -->
      <div class="bg-white rounded-lg shadow-md p-6">
        <h2 class="text-xl font-semibold text-gray-800 mb-4">Minhas Tarefas</h2>

        <!-- Container da lista -->
        <div id="listaTarefas" class="space-y-3">
          <!-- Os itens da lista serão inseridos aqui via JavaScript -->

          <!-- Mensagem quando não há tarefas -->
          <div id="semTarefas" class="text-center py-4 text-gray-500">
            Nenhuma tarefa adicionada ainda.
          </div>
        </div>
      </div>
    </div>

    <!-- Template para item da tarefa -->
    <template id="templateTarefa">
      <div
        class="flex items-center justify-between p-3 bg-gray-50 rounded-lg group"
      >
        <span class="flex-1 text-gray-700"></span>
        <div class="flex gap-2">
          <button
            class="btnEditar text-sm px-3 py-1 text-blue-600 hover:bg-blue-100 rounded"
          >
            Editar
          </button>
          <button
            class="btnExcluir text-sm px-3 py-1 text-red-600 hover:bg-red-100 rounded"
          >
            Excluir
          </button>
        </div>
      </div>
    </template>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="app.js"></script>
  </body>
</html>
